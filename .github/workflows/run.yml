name: Auto Blog Generator

on:
  schedule:
    - cron: '30 23 * * *'
    - cron: '30 8 * * *'
  workflow_dispatch:
    inputs:
      keyword:
        description: '키워드 입력 (비워두거나 "자동" 입력 시 속보우선 / 정보5:종목5 자동선택)'
        required: false
        default: '자동'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Quick Install Packages & Browser
        run: |
          sudo apt-get install -y fonts-nanum
          pip install requests beautifulsoup4 google-genai pillow playwright
          playwright install chromium
      - name: Run Bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NAVER_ID: ${{ secrets.NAVER_ID }}
          NAVER_PW: ${{ secrets.NAVER_PW }}
          TARGET_KEYWORD: ${{ github.event.inputs.keyword || '자동' }}
        run: python bot.py
