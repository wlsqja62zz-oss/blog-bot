name: Auto Blog Generator

on:
  schedule:
    - cron: '30 23 * * *'
    - cron: '30 8 * * *'
  workflow_dispatch:
    inputs:
      keyword:
        description: '검색할 뉴스 키워드 입력'
        required: true
        default: '속보 특징주'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Korean Font & Playwright Browser
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-nanum
          pip install requests beautifulsoup4 google-genai pillow playwright
          playwright install --with-deps chromium
      - name: Run Bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NAVER_ID: ${{ secrets.NAVER_ID }}
          NAVER_PW: ${{ secrets.NAVER_PW }}
          TARGET_KEYWORD: ${{ github.event.inputs.keyword || '속보 특징주' }}
        run: python bot.py
